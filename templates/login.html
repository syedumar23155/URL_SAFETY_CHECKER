<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShieldAI — Login</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#f0f0f0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .bg-grid{position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,200,83,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,83,.03) 1px,transparent 1px);background-size:50px 50px;z-index:0}
  .container{position:relative;z-index:1;width:100%;max-width:420px;padding:20px}
  .logo{text-align:center;margin-bottom:32px}
  .logo h1{font-size:36px;font-weight:700;background:linear-gradient(135deg,#00C853,#00bcd4);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .logo p{color:#9ca3af;font-size:14px;margin-top:4px}
  .card{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:32px}
  .tabs{display:flex;gap:0;margin-bottom:24px;background:#0a0a0f;border-radius:8px;padding:4px}
  .tab{flex:1;padding:10px;text-align:center;border-radius:6px;cursor:pointer;font-size:14px;font-weight:600;color:#9ca3af;border:none;background:transparent;transition:.2s}
  .tab.active{background:#1f2937;color:#00C853}
  .form-section{display:none}
  .form-section.active{display:block}
  label{display:block;font-size:12px;color:#9ca3af;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
  input{width:100%;padding:12px 16px;background:#1f2937;border:1px solid #374151;border-radius:8px;color:#f0f0f0;font-size:14px;font-family:'Inter',sans-serif;transition:.2s;outline:none}
  input:focus{border-color:#00C853;box-shadow:0 0 0 3px rgba(0,200,83,.1)}
  .field{margin-bottom:16px}
  .btn{width:100%;padding:13px;background:linear-gradient(135deg,#00C853,#00897B);border:none;border-radius:8px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:.2s;margin-top:8px}
  .btn:hover{opacity:.85;transform:translateY(-1px)}
  .alert{padding:12px 16px;border-radius:8px;font-size:13px;margin-bottom:16px}
  .alert.error{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.3);color:#ff6b6b}
  .alert.success{background:rgba(0,200,83,.1);border:1px solid rgba(0,200,83,.3);color:#00C853}
  .hint{text-align:center;font-size:12px;color:#6b7280;margin-top:16px}
  .hint b{color:#9ca3af}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="container">
  <div class="logo">
    <h1>🛡️ ShieldAI</h1>
    <p>Intelligent URL Threat Intelligence</p>
  </div>
  <div class="card">
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    {% if success %}<div class="alert success">{{ success }}</div>{% endif %}
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login',this)">Login</button>
      <button class="tab" onclick="switchTab('register',this)">Register</button>
    </div>
    <div id="login" class="form-section active">
      <form method="POST" action="/login">
        <div class="field"><label>Username</label><input name="username" placeholder="Enter username" required></div>
        <div class="field"><label>Password</label><input name="password" type="password" placeholder="Enter password" required></div>
        <button class="btn" type="submit">Login →</button>
      </form>
      <p class="hint">Default: <b>admin</b> / <b>admin123</b></p>
    </div>
    <div id="register" class="form-section">
      <form method="POST" action="/register">
        <div class="field"><label>Username</label><input name="username" placeholder="Choose username" required></div>
        <div class="field"><label>Password</label><input name="password" type="password" placeholder="Choose password (6+ chars)" required></div>
        <button class="btn" type="submit">Create Account →</button>
      </form>
    </div>
  </div>
</div>
<script>
function switchTab(name,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.form-section').forEach(s=>s.classList.remove('active'));
  el.classList.add('active');
  document.getElementById(name).classList.add('active');
}
</script>
</body>
</html>
